<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Comprovante de Pix — UI Demo</title>
  <link rel="stylesheet" href="../css/style1.css">
</head>
<body>
  <main class="screen" aria-label="Demonstração de interface Pix">
    <div class="status" aria-label="Barra de status de demonstração">
      <span class="status-left">09:36 <span class="status-small">◉ ···</span></span>
      <span class="status-right">▴▴ 4G ▰ 18% <span class="battery-dot">●</span></span>
    </div>

    <header class="toolbar">
      <button type="button" class="toolbar-btn" id="back" aria-label="Voltar">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15 4 7 12l8 8"/>
        </svg>
      </button>
      <button type="button" class="toolbar-btn" id="download" aria-label="Baixar demonstração">
        <img src="../img/download.png" alt="" class="download-icon" draggable="false">
      </button>
    </header>

    <section class="intro">
      <h1>Comprovante de Pix</h1>
      <p class="date">03/fev/2026 - 09:36:15</p>
      <div class="success">
        <img src="../img/check.png" alt="" class="check-icon" draggable="false">
        <span>Pagamento de demonstração enviado!</span>
      </div>
    </section>

    <div class="rule" aria-hidden="true"></div>

    <section class="details" aria-label="Detalhes de demonstração">
      <div class="field value">
        <div class="label">Valor</div>
        <div class="amount">R$ 10,00</div>
      </div>
      <div class="field recipient">
        <div class="label">Para</div>
        <div class="strong">ONE XPAYMENTE LTDA</div>
        <div>35.967.485/0001-71</div>
        <div>A55 SCD S.A.</div>
      </div>
      <div class="field sender">
        <div class="label">De</div>
        <div class="strong">GEOVANI DE ARAUJO</div>
        <div>***.267.796-**</div>
        <div>PICPAY</div>
      </div>
      <div class="field transaction">
        <div class="label">ID da transação</div>
        <div class="transaction-id">E08561701202610081338W878W00FUHV</div>
      </div>
    </section>

 
<!-- BOTTOM ACTIONS -->
<nav class="actions" aria-label="Ações da demonstração">

  <!-- NÚT 1: FAZER OUTRO PIX -->
  <button
    id="new"
    class="action-btn"
    type="button"
  >
    <span class="action-icon">
      <img
        src="../img/new-pix.png"
        alt=""
        class="action-img new-pix-img"
        draggable="false"
      >
    </span>

    <span class="action-text">
      Fazer outro<br>Pix
    </span>
  </button>

  <!-- NÚT 2: COMPARTILHAR -->
  <button
    id="share"
    class="action-btn"
    type="button"
  >
    <span class="action-icon">
      <img
        src="../img/share.png"
        alt=""
        class="action-img share-img"
        draggable="false"
      >
    </span>

    <span class="action-text">
      Compartilhar<br>comprovante
    </span>
  </button>

  <!-- NÚT 3: FAVORITAR -->
  <button
    id="favorite"
    class="action-btn"
    type="button"
  >
    <span class="action-icon">
      <img
        src="../img/favorite.png"
        alt=""
        class="action-img favorite-img"
        draggable="false"
      >
    </span>

    <span class="action-text">
      Favoritar<br>contato
    </span>
  </button>

</nav>

    <div id="toast" role="status" aria-live="polite"></div>
  </main>
  <script src="../js/app.js"></script>
</body>
</html>
